daemon off;
master_process off;
pid /tmp/ngx-int3/nginx.pid;
error_log /tmp/ngx-int3/error.log notice;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/ngx-int3/body;
    proxy_temp_path /tmp/ngx-int3/proxy;
    fastcgi_temp_path /tmp/ngx-int3/fastcgi;
    uwsgi_temp_path /tmp/ngx-int3/uwsgi;
    scgi_temp_path /tmp/ngx-int3/scgi;
    server {
        listen 127.0.0.1:18088;
        server_name localhost;
        root /tmp/ngx-int3/www;
        location = /plain { return 200 'healthy'; }
        location /files/ { alias /tmp/ngx-int3/www/; }
    }
}
